<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>One Shot — For Sadiya</title>
  <style>
    html { background: #000; }
    #entryOverlay {
      position: fixed; inset: 0; background: #000;
      z-index: 999999; pointer-events: none;
      transition: opacity 0.5s ease;
    }
    /* Start 17s into the drift so moon is right at the left edge when it appears */
    #moonBackground.animating {
      animation-delay: -20s;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://public.codepenassets.com/css/reset-2.0.min.css">
  <link rel="stylesheet" href="./lighter-scene.css">
</head>
<body>

  <div id="entryOverlay"></div>

  <!-- ══════════════════════════════════════════
       SCENE 1 — LIGHTER + FUSE
       Visible at start, fades out after explosion
  ══════════════════════════════════════════ -->
  <div id="lighterScene">

    <!-- Parallax sky layers -->
    <div id="sky-bg"></div>
    <div id="sky-stars"></div>

    <!-- Fuse canvas (full-screen rope) -->
    <canvas id="fuse-canvas"></canvas>

    <!-- The lighter -->
    <div class="wrapper">
      <div class="clipper" id="lighter">
        <div class="stone"></div>
        <div class="flame-wrap">
          <div class="flame" id="flame"></div>
        </div>
        <div class="metal">
          <div class="dent"></div>
        </div>
        <div class="trigger">
          <div class="top"></div>
          <div class="bottom"></div>
        </div>
        <div class="right-part"></div>
        <div class="body"></div>
        <div class="stone-holder"></div>
      </div>
    </div>

    <!-- Explosion overlay (stays inside lighter scene, bridges to fireworks) -->
    <div id="explosion"></div>

    <!-- Hint text -->
    <p id="hint">hold the lighter &amp; bring the flame to the fuse</p>

  </div>

  <!-- ══════════════════════════════════════════
       MOON — lives outside both scenes so neither
       scene's opacity transition affects it
  ══════════════════════════════════════════ -->
  <div id="moonBackground"></div>

  <!-- ══════════════════════════════════════════
       SCENE 2 — FIREWORKS
       Hidden initially, revealed after fuse explodes
  ══════════════════════════════════════════ -->
  <div id="fireworksSection">

    <div class="container">
      <div class="loading-init" id="fw-loading">
        <div class="loading-init__header"></div>
        <div class="loading-init__status"></div>
      </div>
      <div class="stage-container">
        <div class="canvas-container">
          <canvas id="trails-canvas"></canvas>
          <canvas id="main-canvas"></canvas>
        </div>

        <!-- Controls -->
        <div class="controls" style="justify-content:flex-end; z-index:100; position:absolute; top:0; width:100%;">
          <div class="btn pause-btn" style="display:none;"></div>
          <div class="btn sound-btn" style="display:none;"></div>
          <div class="btn settings-btn" onclick="if(typeof toggleMenu==='function')toggleMenu();"
               style="opacity:1; cursor:pointer; background:rgba(0,0,0,0.45); border-radius:50%; margin:8px;">
            <svg fill="white" width="24" height="24" viewBox="0 0 24 24">
              <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
            </svg>
          </div>
        </div>

        <!-- Settings menu -->
        <div class="menu hide" style="z-index:200; position:absolute; top:0; bottom:0; left:0; right:0;">
          <div class="menu__inner-wrap">
            <div class="btn btn--bright close-menu-btn" onclick="if(typeof toggleMenu==='function')toggleMenu(false);">
              <svg fill="white" width="24" height="24" viewBox="0 0 24 24">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
              </svg>
            </div>
            <div class="menu__header">Settings</div>
            <div class="menu__subheader">For more info, click any label.</div>
            <form>
              <div class="form-option form-option--select"><label class="shell-type-label">Shell Type</label><select class="shell-type"></select></div>
              <div class="form-option form-option--select" style="display:none"><label class="shell-size-label">Shell Size</label><select class="shell-size"></select></div>
              <div class="form-option form-option--select"><label class="quality-ui-label">Quality</label><select class="quality-ui"></select></div>
              <div class="form-option form-option--select"><label class="sky-lighting-label">Sky Lighting</label><select class="sky-lighting"></select></div>
              <div class="form-option form-option--select"><label class="scaleFactor-label">Scale</label><select class="scaleFactor"></select></div>
              <div class="form-option form-option--checkbox"><label class="auto-launch-label">Auto Fire</label><input class="auto-launch" type="checkbox"/></div>
              <div class="form-option form-option--checkbox form-option--finale-mode"><label class="finale-mode-label">Finale Mode</label><input class="finale-mode" type="checkbox"/></div>
              <div class="form-option form-option--checkbox"><label class="hide-controls-label">Hide Controls</label><input class="hide-controls" type="checkbox"/></div>
              <div class="form-option form-option--checkbox form-option--fullscreen"><label class="fullscreen-label">Fullscreen</label><input class="fullscreen" type="checkbox"/></div>
              <div class="form-option form-option--checkbox"><label class="long-exposure-label">Open Shutter</label><input class="long-exposure" type="checkbox"/></div>
            </form>
            <div class="credits"> <a href="https://cmiller.tech/" target="_blank"></a>.</div>
          </div>
        </div>
      </div>

      <!-- Help modal -->
      <div class="help-modal">
        <div class="help-modal__overlay"></div>
        <div class="help-modal__dialog">
          <div class="help-modal__header"></div>
          <div class="help-modal__body"></div>
          <button type="button" class="help-modal__close-btn">Close</button>
        </div>
      </div>
    </div>

  </div><!-- /fireworksSection -->


  <!-- ══ fscreen polyfill ══ -->
  <script>
    window._fscreenFallback = function() {
      if (typeof fscreen === 'undefined') {
        window.fscreen = {
          fullscreenEnabled: !!(document.fullscreenEnabled || document.webkitFullscreenEnabled),
          fullscreenElement: null,
          requestFullscreen: el => el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen && el.webkitRequestFullscreen()),
          exitFullscreen: () => document.exitFullscreen ? document.exitFullscreen() : (document.webkitExitFullscreen && document.webkitExitFullscreen()),
          addEventListener: (evt, fn) => document.addEventListener('fullscreenchange', fn),
          removeEventListener: (evt, fn) => document.removeEventListener('fullscreenchange', fn),
        };
      }
    };
  </script>
  <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/fscreen%401.0.1.js" onerror="window._fscreenFallback()"></script>
  <script>window._fscreenFallback();</script>
  <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/Stage%400.1.4.js"></script>
  <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/MyMath.js"></script>

  <!-- ══ App scripts — order matters ══ -->
  <script src="./fireworks-engine.js"></script>
  <script src="./lighter-main.js"></script>

  <!-- ══ Drop entry overlay after scripts initialise ══ -->
  <script>
    (function () {
      var o = document.getElementById('entryOverlay');
      if (!o) return;
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          o.style.opacity = '0';
          setTimeout(function () { o.parentNode && o.parentNode.removeChild(o); }, 500);
        });
      });
    })();
  </script>

</body>
</html>
